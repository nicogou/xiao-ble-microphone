# This file contains selected Kconfig options for the application.

# ---------------------------------------------------------------------------
# USB device (CDC-ACM shell); MSC disk is added by rec.conf
# ---------------------------------------------------------------------------
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_FLASH=y
# See Nordic known issue NCSDK-40096
CONFIG_UDC_BUF_POOL_SIZE=8192

# ---------------------------------------------------------------------------
# Round display UI – Seeed XIAO Round Display + LVGL
# ---------------------------------------------------------------------------
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SYS_HEAP=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_LV_Z_POINTER_FROM_CHOSEN_TOUCH=y
CONFIG_APP_DISPLAY_UI=y

# Hardware info – used to generate a unique USB serial-number string
CONFIG_HWINFO=y

# ---------------------------------------------------------------------------
# Entropy / random number generator (required by the note game)
# ---------------------------------------------------------------------------
CONFIG_ENTROPY_GENERATOR=y

# ---------------------------------------------------------------------------
# IMU motion/tap detection – LSM6DS3TR-C
# ---------------------------------------------------------------------------
# SENSOR enables the subsystem (required for the lsm6dsl driver to compile).
# Use no-trigger mode so the imu module owns the INT1 GPIO line itself.
CONFIG_SENSOR=y
CONFIG_LSM6DSL_TRIGGER_NONE=y

# ---------------------------------------------------------------------------
# PDM microphone (used by pitch detection)
# ---------------------------------------------------------------------------
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Regulator API (already selected by board defconfig; listed here for clarity)
CONFIG_REGULATOR=y

# Enable USB device stack internal warnings so enumeration issues are visible
CONFIG_USBD_LOG_LEVEL_WRN=y

# ---------------------------------------------------------------------------
# Shell (available immediately via USB CDC-ACM)
# ---------------------------------------------------------------------------
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096

# Floating-point unit – required by pitch detection (MPM uses float math)
CONFIG_FPU=y

CONFIG_HEAP_MEM_POOL_SIZE=32768

# ---------------------------------------------------------------------------
# Application modules
# ---------------------------------------------------------------------------
CONFIG_APP_PITCH=y
