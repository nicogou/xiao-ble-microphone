# This file contains selected Kconfig options for the application.

# ---------------------------------------------------------------------------
# USB Mass Storage Class – external QSPI flash (P25Q16H, 2 MB)
# ---------------------------------------------------------------------------

# Use the new experimental USB device stack
CONFIG_USB_DEVICE_STACK_NEXT=y
# Prevent CDC-ACM from auto-enabling USB before main() initialises it
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Flash subsystem (required by the flash-disk driver)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Expose a flash partition as a block device
CONFIG_DISK_DRIVER_FLASH=y

# USB MSC class
CONFIG_USBD_MSC_CLASS=y

# Increase the UDC net_buf pool so the host can issue large transfers without
# triggering "Failed to allocate net_buf 4095, ep 0x80" errors.
# See Nordic known issue NCSDK-40096 and its workaround.
CONFIG_UDC_BUF_POOL_SIZE=8192

# Hardware info – used to generate a unique USB serial-number string
CONFIG_HWINFO=y

# Enable USB device stack internal warnings so enumeration issues are visible
CONFIG_USBD_LOG_LEVEL_WRN=y

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048
