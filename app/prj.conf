# This file contains selected Kconfig options for the application.

# ---------------------------------------------------------------------------
# USB Mass Storage Class – external QSPI flash (P25Q16H, 2 MB)
# ---------------------------------------------------------------------------

# Use the new experimental USB device stack
CONFIG_USB_DEVICE_STACK_NEXT=y
# Prevent CDC-ACM from auto-enabling USB before main() initialises it
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Flash subsystem (required by the flash-disk driver)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Expose a flash partition as a block device
CONFIG_DISK_DRIVER_FLASH=y

# USB MSC class
CONFIG_USBD_MSC_CLASS=y

# Increase the UDC net_buf pool so the host can issue large transfers without
# triggering "Failed to allocate net_buf 4095, ep 0x80" errors.
# See Nordic known issue NCSDK-40096 and its workaround.
CONFIG_UDC_BUF_POOL_SIZE=8192

# Hardware info – used to generate a unique USB serial-number string
CONFIG_HWINFO=y

# ---------------------------------------------------------------------------
# FAT filesystem – used to store the WAV recording on the QSPI flash
# ---------------------------------------------------------------------------
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
# Auto-format the disk on first mount if no FAT filesystem is found
CONFIG_FS_FATFS_MOUNT_MKFS=y
# Enable f_expand() for fast contiguous cluster pre-allocation
CONFIG_FS_FATFS_EXTRA_NATIVE_API=y

# ---------------------------------------------------------------------------
# PDM microphone recording
# ---------------------------------------------------------------------------
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Regulator API (already selected by board defconfig; listed here for clarity)
CONFIG_REGULATOR=y

# Enable USB device stack internal warnings so enumeration issues are visible
CONFIG_USBD_LOG_LEVEL_WRN=y

# ---------------------------------------------------------------------------
# Shell (available immediately via USB CDC-ACM)
# ---------------------------------------------------------------------------
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# Shell needs extra stack for FAT file operations
CONFIG_SHELL_STACK_SIZE=4096

CONFIG_LOG=y
# Larger stack: FAT and DMIC stack usage combined exceeds the 2 KB default
CONFIG_MAIN_STACK_SIZE=4096
